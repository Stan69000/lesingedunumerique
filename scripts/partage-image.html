<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#0b1120;font-family:'Space Grotesk',system-ui,sans-serif;color:#f1f5f9;
       display:flex;align-items:center;gap:64px;padding:0 84px;position:relative}
  body::before{content:'';position:absolute;inset:0;
       background:radial-gradient(900px 520px at 88% 12%, rgba(45,212,191,.16), transparent 62%),
                  radial-gradient(640px 420px at 4% 96%, rgba(249,115,22,.12), transparent 60%)}
  .logo{width:286px;height:286px;flex:none;position:relative;z-index:1}
  .logo img{width:100%;height:100%;object-fit:contain}
  .text{position:relative;z-index:1;min-width:0}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:.17em;
       text-transform:uppercase;color:#2dd4bf;margin-bottom:22px}
  h1{font-size:74px;line-height:1.03;font-weight:800;letter-spacing:-.022em}
  h1 em{font-style:normal;color:#2dd4bf}
  p{font-size:31px;line-height:1.38;font-weight:300;color:#94a3b8;margin-top:26px;max-width:19ch}
  .rule{position:absolute;left:0;right:0;bottom:0;height:9px;
       background:linear-gradient(90deg,#2dd4bf 0%,#2dd4bf 46%,#f97316 46%,#f97316 100%)}
  .url{position:absolute;right:84px;bottom:42px;font-family:'JetBrains Mono',monospace;
       font-size:22px;color:#64748b;z-index:1}
</style></head>
<body>
  <div class="logo"><img src="../public/logo.svg" alt=""></div>
  <div class="text">
    <div class="kicker">Association d’inclusion numérique</div>
    <h1>Le Singe<br>Du <em>Numérique</em></h1>
    <p>Comprendre le numérique, sans jargon.</p>
  </div>
  <div class="url">lesingedunumerique.fr</div>
  <div class="rule"></div>
</body></html>
