ServerName localhost
ServerTokens Prod
ServerSignature Off
Timeout 110
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 2
    MaxRequestWorkers 2
    MaxConnectionsPerChild 100
</IfModule>
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
</Directory>
<Files "engine.php">
    Require all denied
</Files>
