name: Deploy O2Switch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-o2switch-production
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Security audit (root production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Inoreader live credentials
        env:
          INOREADER_TOKEN: ${{ secrets.INOREADER_TOKEN }}
          INOREADER_ACCESS_TOKEN: ${{ secrets.INOREADER_ACCESS_TOKEN }}
          INOREADER_CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
          INOREADER_CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
        run: |
          set -eu

          if [ -n "${INOREADER_TOKEN:-}" ] || [ -n "${INOREADER_ACCESS_TOKEN:-}" ]; then
            echo "Inoreader auth present via direct token."
            exit 0
          fi

          if [ -n "${INOREADER_CLIENT_ID:-}" ] && [ -n "${INOREADER_CLIENT_SECRET:-}" ] && [ -n "${INOREADER_REFRESH_TOKEN:-}" ]; then
            echo "Inoreader auth present via OAuth refresh flow."
            exit 0
          fi

          echo "Missing required Inoreader credentials for live veille build."
          echo "Set either:"
          echo "- INOREADER_TOKEN (legacy) or INOREADER_ACCESS_TOKEN"
          echo "- OR INOREADER_CLIENT_ID + INOREADER_CLIENT_SECRET + INOREADER_REFRESH_TOKEN"
          exit 1

      - name: Build site
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          INOREADER_TOKEN: ${{ secrets.INOREADER_TOKEN }}
          INOREADER_ACCESS_TOKEN: ${{ secrets.INOREADER_ACCESS_TOKEN }}
          INOREADER_CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
          INOREADER_CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
          INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
          INOREADER_OAUTH_TOKEN_URL: ${{ vars.INOREADER_OAUTH_TOKEN_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          VEILLE_ENABLE_ENRICHMENT: "false"
        run: npm run build

      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7
          # Sans ça, upload-artifact écarte les fichiers cachés : dist/.htaccess
          # n'atteignait jamais le serveur et aucune de ses directives (CSP,
          # redirections, ErrorDocument) n'était appliquée en production.
          include-hidden-files: true

      - name: Download candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-candidate
          path: ./dist-candidate

      - name: Download last known good artifact
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151  # v21
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: deploy-o2switch.yml
          branch: main
          name: last-known-good-dist
          path: ./last-known-good
          if_no_artifact_found: warn

      - name: Check if backup is available
        id: backup
        run: |
          if [ -d ./last-known-good ] && [ "$(find ./last-known-good -type f | wc -l | tr -d ' ')" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate to O2Switch
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287  # v4.4.0
        with:
          server: ${{ secrets.O2SWITCH_FTP_SERVER }}
          username: ${{ secrets.O2SWITCH_FTP_USERNAME }}
          password: ${{ secrets.O2SWITCH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist-candidate/
          server-dir: ${{ secrets.O2SWITCH_REMOTE_DIR }}
          exclude: |
            **/.git*
            **/.DS_Store
            admin/**

      - name: Healthcheck production
        id: healthcheck
        continue-on-error: true
        env:
          HEALTHCHECK_URLS: ${{ secrets.O2SWITCH_HEALTHCHECK_URLS }}
        run: |
          set -eu

          DEFAULT_URLS="https://lesingedunumerique.fr/index.html\nhttps://lesingedunumerique.fr/sitemap.xml"
          RAW_URLS="${HEALTHCHECK_URLS:-$DEFAULT_URLS}"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=20

          printf "%b\n" "$RAW_URLS" | tr ',' '\n' | sed '/^[[:space:]]*$/d' > health_urls.txt

          # O2Switch can keep returning 503 for several minutes after FTPS sync while
          # the new files become visible. Start with a warm-up pause, then retry long
          # enough to ride out the swap window before declaring the deploy unhealthy.
          sleep "$SLEEP_SECONDS"

          while IFS= read -r url; do
            probe_url="$url"
            case "$probe_url" in
              */)
                probe_url="${probe_url}index.html"
                ;;
            esac
            attempt=1
            passed=0
            while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
              echo "Healthcheck attempt ${attempt}/${MAX_ATTEMPTS}: ${probe_url}"
              if curl --fail --silent --show-error --location --max-time 20 --header 'Cache-Control: no-cache' "$probe_url" > /dev/null; then
                passed=1
                break
              fi
              attempt=$((attempt + 1))
              sleep "$SLEEP_SECONDS"
            done

            if [ "$passed" -ne 1 ]; then
              echo "Healthcheck failed for ${probe_url}"
              exit 1
            fi
          done < health_urls.txt

      - name: Warn if healthchecks failed after deploy
        if: steps.healthcheck.outcome == 'failure'
        run: |
          echo "::warning title=Post-deploy healthcheck failed::O2Switch returned an unhealthy response after deploy. Deployment was left in place and no automatic rollback was attempted."

      - name: Publish new last known good artifact
        if: steps.healthcheck.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: last-known-good-dist
          path: ./dist-candidate/
          if-no-files-found: error
          retention-days: 90
          # Idem : sinon un rollback republierait un déploiement sans .htaccess.
          include-hidden-files: true
