name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies (root)
        run: npm ci

      - name: Security audit (root)
        run: npm audit --audit-level=high

      - name: Build (root)
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Install dependencies (decap-oauth-vercel)
        working-directory: decap-oauth-vercel
        run: npm ci

      - name: Security audit (decap-oauth-vercel)
        id: decap_audit
        working-directory: decap-oauth-vercel
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Warn if decap-oauth-vercel audit failed
        if: steps.decap_audit.outcome == 'failure'
        run: |
          echo "decap-oauth-vercel has unresolved high vulnerabilities requiring breaking upgrades."
          echo "This step is non-blocking for now to keep production pipeline operational."

      - name: Build (decap-oauth-vercel)
        working-directory: decap-oauth-vercel
        env:
          OAUTH_GITHUB_CLIENT_ID: ci-placeholder-client-id
          OAUTH_GITHUB_CLIENT_SECRET: ci-placeholder-client-secret
        run: npm run build

      - name: Secret scan (gitleaks CLI)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE_URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSL "${BASE_URL}/${ARCHIVE}" -o "${ARCHIVE}"
          curl -sSL "${BASE_URL}/checksums.txt" -o checksums.txt
          grep "${ARCHIVE}" checksums.txt | sha256sum --check --status
          tar -xzf "${ARCHIVE}" gitleaks
          chmod +x gitleaks
          ./gitleaks version
          ./gitleaks git --redact --no-banner --exit-code 1
