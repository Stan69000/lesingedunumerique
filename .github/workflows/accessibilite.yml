name: Accessibilité (astro-a11y)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibilite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  astro-a11y:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Scan astro-a11y
        uses: Stan69000/astro-a11y@a3575dce16945119cb0cef07888da8c5932f39e7  # v0.2.3
        with:
          target: dist
          lang: fr
          baseline: a11y-baseline.json
          fail-on: major
